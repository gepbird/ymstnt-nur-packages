name: "Update Flake Packages ❄️"
on:
  workflow_dispatch:
  schedule:
    - cron: "25 11 * * *"
  # these allow the workflow to show up when it's not on main yet
  pull_request:
  push:
    branches:
      - '**'
permissions:
  contents: write
  pull-requests: write
jobs:
  updateFlakePackages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: cachix/install-nix-action@v31.10.7
        with:
          nix_path: "nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/nixos-unstable.tar.gz"
      - name: Update flake packages
        uses: gepbird/nix-update-action@306c8d4dc70db95b5153036a27b55ef168425330
        with:
          packages : "beeper,brave-origin,equicord,lunatask,uni-week-counter"
